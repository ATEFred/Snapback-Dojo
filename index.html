<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap Back Dojo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥋</text></svg>">
<style>
:root{
  --bg:#0e1216; --bg2:#151c22; --card:#1a232b; --card2:#212d37;
  --ink:#e8eef2; --dim:#93a4b1; --bamboo:#7ac74f; --gold:#e8b64c;
  --red:#e5604d; --blue:#5aa7d6; --purple:#a78bda; --line:#2b3844;
  --radius:18px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #17222b 0%, var(--bg) 60%);
  color:var(--ink);
  font-family:"Segoe UI","Noto Sans",system-ui,sans-serif;
  font-size:17px; line-height:1.45;
}
button{font:inherit; cursor:pointer; border:none; border-radius:14px;}
input,textarea,select{
  font:inherit; color:var(--ink); background:var(--bg2);
  border:2px solid var(--line); border-radius:12px; padding:10px 14px; width:100%;
}
textarea{resize:vertical;}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--bamboo);}
header{
  display:flex; align-items:center; gap:14px; padding:14px 20px;
  border-bottom:1px solid var(--line); background:rgba(14,18,22,.85);
  position:sticky; top:0; z-index:5; flex-wrap:wrap;
}
header .logo{font-size:22px; font-weight:800; letter-spacing:.5px;}
header .logo em{color:var(--bamboo); font-style:normal;}
.spacer{flex:1;}
.chip{
  background:var(--card); border:1px solid var(--line); border-radius:99px;
  padding:6px 14px; font-size:14px; color:var(--dim); white-space:nowrap;
}
.chip b{color:var(--ink);}
.chip.warn{border-color:var(--red); color:var(--red);}
button.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line); padding:6px 14px;}
button.ghost:hover{background:var(--card2);}
main{max-width:980px; margin:0 auto; padding:24px 20px 80px;}
.screen{display:none;}
.screen.on{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1;}}
h1{font-size:26px; margin-bottom:4px;}
h2{font-size:21px; margin-bottom:10px;}
.sub{color:var(--dim); margin-bottom:22px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; text-align:left;
}
button.card{transition:transform .12s ease, border-color .12s;}
button.card:hover{transform:translateY(-3px); border-color:var(--bamboo);}
.card .big{font-size:34px;}
.card h3{font-size:19px; margin:8px 0 4px;}
.card p{color:var(--dim); font-size:15px;}
.tag{
  display:inline-block; font-size:12px; font-weight:700; letter-spacing:.5px;
  border-radius:99px; padding:2px 10px; margin-bottom:6px; text-transform:uppercase;
}
.tag.shield{background:#1d3a4d; color:var(--blue);}
.tag.fang{background:#4d231d; color:var(--red);}
.tag.locked{background:#33303f; color:var(--purple);}
.tag.custom{background:#2c3d1f; color:var(--bamboo);}
/* xp bar */
.beltbar{display:flex; align-items:center; gap:14px; margin:4px 0 26px;}
.beltbar .track{flex:1; height:14px; background:var(--bg2); border-radius:99px; overflow:hidden; border:1px solid var(--line);}
.beltbar .fill{height:100%; background:linear-gradient(90deg,var(--bamboo),var(--gold)); width:0%; transition:width .5s;}
/* drill */
.stage{max-width:760px; margin:0 auto;}
.scene{display:flex; gap:14px; align-items:center; margin-bottom:10px;}
.avatar{
  font-size:38px; width:64px; height:64px; display:flex; align-items:center; justify-content:center;
  background:var(--card2); border-radius:50%; border:2px solid var(--line); flex-shrink:0;
}
.setup{color:var(--dim); font-size:15px;}
.bubble{
  background:var(--card2); border:1px solid var(--line); border-radius:16px 16px 16px 4px;
  padding:16px 18px; font-size:20px; margin:12px 0 18px; position:relative;
}
.replay{
  background:var(--bg2); color:var(--dim); border:1px solid var(--line);
  border-radius:99px; padding:4px 14px; font-size:14px; margin-bottom:18px;
}
.opt{
  display:block; width:100%; text-align:left; background:var(--card); color:var(--ink);
  border:2px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;
  font-size:17px;
}
.opt:hover:not(:disabled){border-color:var(--bamboo);}
.opt.correct{border-color:var(--bamboo); background:#1d3317;}
.opt.okish{border-color:var(--gold); background:#33301a;}
.opt.wrongpick{border-color:var(--red); background:#331714;}
.opt:disabled{opacity:.85; cursor:default;}
.answerbox{display:flex; gap:10px; margin-bottom:10px;}
.answerbox textarea{min-height:56px;}
.modebtns{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.btn{
  background:var(--bamboo); color:#0c1208; font-weight:800; padding:12px 22px; border-radius:14px;
}
.btn.secondary{background:var(--card2); color:var(--ink); border:1px solid var(--line); font-weight:600;}
.btn.danger{background:var(--red); color:#fff;}
.btn:disabled{opacity:.5;}
.hintchip{font-size:13px; color:var(--dim); margin-bottom:14px;}
/* feedback */
.fb{border-radius:var(--radius); padding:18px; margin-top:8px; border:2px solid var(--line); background:var(--card);}
.fb.best{border-color:var(--bamboo);} .fb.okish{border-color:var(--gold);} .fb.wrong{border-color:var(--red);}
.fb .verdict{font-size:20px; font-weight:800; margin-bottom:6px;}
.fb .coach{margin-bottom:8px;}
.fb .better{color:var(--gold); margin-bottom:8px; font-size:15px;}
.fb .why{color:var(--dim); font-size:15px;}
.thinking{color:var(--dim); font-size:14px; animation:pulse 1.2s infinite;}
@keyframes pulse{50%{opacity:.4;}}
/* rapid fire */
.rfbar{height:10px; background:var(--bg2); border-radius:99px; overflow:hidden; margin-bottom:18px; border:1px solid var(--line);}
.rfbar .rffill{height:100%; background:var(--red); width:100%;}
.combo{font-size:16px; font-weight:800; color:var(--gold); min-height:24px; margin-bottom:8px;}
/* boss */
.hpwrap{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.hp{flex:1; height:18px; background:var(--bg2); border:1px solid var(--line); border-radius:99px; overflow:hidden;}
.hp .in{height:100%; background:linear-gradient(90deg,var(--red),var(--gold)); transition:width .4s;}
/* learn */
.movecard .how{margin:10px 0 10px 20px; color:var(--dim);}
.movecard .ex{
  background:var(--bg2); border-left:4px solid var(--bamboo); padding:8px 14px;
  border-radius:0 10px 10px 0; margin-bottom:8px; font-size:18px;
}
.movecard .say{display:flex; align-items:center; gap:10px; margin-bottom:6px; color:var(--dim); font-size:15px;}
.backbtn{margin-bottom:18px;}
/* parent modal */
.modal{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20;
  overflow-y:auto; padding:30px 14px;
}
.modal.on{display:block;}
.modal .inner{max-width:640px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:14px; color:var(--dim); margin-bottom:5px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.row>*{flex:1;}
.listrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px;}
hr{border:none; border-top:1px solid var(--line); margin:20px 0;}
/* bubbles minigame */
#bubbles{
  display:none; position:fixed; inset:0; background:rgba(10,14,18,.92); z-index:30; overflow:hidden;
}
#bubbles.on{display:block;}
#bubbles .hud{position:absolute; top:14px; left:0; right:0; text-align:center; z-index:2; color:var(--dim);}
#bubbles .hud b{color:var(--ink); font-size:22px;}
.bub{
  position:absolute; border-radius:50%; background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(122,199,79,.35));
  border:2px solid rgba(122,199,79,.6); display:flex; align-items:center; justify-content:center;
  color:var(--ink); font-weight:700; cursor:pointer; user-select:none; text-align:center; padding:6px;
}
.floatxp{
  position:fixed; z-index:40; color:var(--gold); font-weight:900; pointer-events:none;
  animation:rise 1.1s ease-out forwards; font-size:20px;
}
@keyframes rise{to{transform:translateY(-70px); opacity:0;}}
.done-quote{font-size:24px; font-weight:800; color:var(--bamboo); margin:16px 0;}
/* ===== coins, hype & shop ===== */
header .logo{user-select:none;}
.chip.coins{border-color:var(--gold); color:var(--gold); font-weight:800; cursor:pointer; background:var(--card);}
.chip.coins.bump{animation:bump .5s cubic-bezier(.2,1.8,.4,1);}
@keyframes bump{40%{transform:scale(1.4) rotate(-8deg);}}
.floatcoin{position:fixed; z-index:50; color:var(--gold); font-weight:900; pointer-events:none; animation:rise 1.1s ease-out forwards; font-size:19px; text-shadow:0 2px 8px rgba(0,0,0,.6);}
#confetti{position:fixed; inset:0; z-index:45; pointer-events:none; overflow:hidden;}
.cfy{position:absolute; top:-24px; width:10px; height:15px; border-radius:3px; animation:cfyfall linear forwards; font-style:normal; font-size:20px;}
@keyframes cfyfall{to{transform:translateY(115vh) rotate(720deg); opacity:.85;}}
#hype{display:none; position:fixed; inset:0; background:rgba(5,8,11,.82); backdrop-filter:blur(3px); z-index:46; align-items:center; justify-content:center; padding:20px; cursor:pointer;}
#hype.on{display:flex;}
.hypebox{text-align:center; background:var(--card); border:2px solid var(--gold); border-radius:26px; padding:34px 40px; max-width:480px; animation:hypein .5s cubic-bezier(.2,1.7,.4,1);}
@keyframes hypein{from{transform:scale(.25) rotate(-8deg); opacity:0;}}
.hypebox .huge{font-size:74px; display:inline-block; animation:bob 1.1s ease-in-out infinite alternate;}
@keyframes bob{to{transform:translateY(-12px) scale(1.07);}}
.hypebox h2{font-size:26px; margin:12px 0 6px;}
.hypebox p{color:var(--dim);}
.hypebox .prize{color:var(--gold); font-weight:800; font-size:18px; margin-top:10px;}
.hypebox .go{font-size:12px; margin-top:16px; opacity:.7;}
.egg{font-size:92px; display:inline-block; animation:wob .9s ease-in-out infinite;}
@keyframes wob{25%{transform:rotate(-14deg);} 75%{transform:rotate(14deg);}}
.opt.wrongpick{animation:shake .45s;}
@keyframes shake{20%{transform:translateX(-8px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(4px);}}
.shopgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:22px;}
.shopitem{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px 14px; display:flex; gap:12px; align-items:center;}
.shopitem .ic{font-size:32px; flex-shrink:0;}
.shopitem h4{font-size:15px; margin-bottom:2px;}
.shopitem .cd{color:var(--dim); font-size:12.5px; line-height:1.3;}
.shopitem .act{margin-left:auto; flex-shrink:0;}
.cost{color:var(--gold); font-weight:800; font-size:14px;}
.cost.short{color:var(--dim); font-weight:600;}
.wallgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:10px; margin-bottom:20px;}
.cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:36px; background:var(--card); border:1px solid var(--line); border-radius:16px; animation:hypein .4s cubic-bezier(.2,1.7,.4,1);}
.cell small{font-size:10px; color:var(--dim); font-weight:600;}
.cell.empty{border-style:dashed; color:var(--line); font-size:22px;}
.tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.tabs button{background:var(--card); border:1px solid var(--line); color:var(--dim); padding:8px 16px; border-radius:99px;}
.tabs button.on{background:var(--card2); color:var(--ink); border-color:var(--bamboo); font-weight:700;}
.trophy{display:flex; gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:14px; margin-bottom:8px; background:var(--card);}
.trophy.locked{opacity:.45;}
.trophy .ic{font-size:30px;}
.trophy .coins-tag{margin-left:auto; color:var(--gold); font-weight:800; font-size:14px; white-space:nowrap;}
.coinbank{font-size:34px; font-weight:900; color:var(--gold); margin-bottom:4px;}
/* ===== dojo pet ===== */
#miniPet{font-size:24px; cursor:pointer; transition:transform .3s; display:inline-block;}
#miniPet:hover{transform:scale(1.25) rotate(-8deg);}
.petcard{display:flex; align-items:center; gap:16px; margin:4px 0 22px; cursor:pointer; width:100%; transition:transform .12s, border-color .12s;}
.petcard:hover{transform:translateY(-2px); border-color:var(--gold);}
.petwrap{position:relative; font-size:54px; width:84px; height:84px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.petwrap .petbody{animation:bob 1.6s ease-in-out infinite alternate;}
.petwrap .acc{position:absolute; top:-6px; right:-8px; font-size:26px;}
.petwrap.aura-fire{filter:drop-shadow(0 0 12px rgba(229,96,77,.75));}
.petwrap.aura-fire .petbody{animation:bob 1.1s ease-in-out infinite alternate, tigerglow 1.8s ease-in-out infinite alternate;}
@keyframes tigerglow{to{filter:drop-shadow(0 0 16px rgba(232,182,76,.9));}}
.petinfo b{font-size:18px;}
.petinfo .petnext{color:var(--dim); font-size:13.5px; margin-top:3px;}
.ladder{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 6px; justify-content:center;}
.ladder .st{font-size:28px; background:var(--bg2); border:2px solid var(--line); border-radius:12px; padding:7px 10px; line-height:1;}
.ladder .st.locked{opacity:.3; filter:grayscale(1);}
.ladder .st.now{border-color:var(--gold); box-shadow:0 0 12px rgba(232,182,76,.4);}
.petactions{display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
.petactions>*{flex:0 1 auto;}
/* ===== ninjas / accounts ===== */
#acctPick{display:none; position:fixed; inset:0; background:radial-gradient(1100px 550px at 50% -10%, var(--bg2) 0%, var(--bg) 65%); z-index:60; align-items:center; justify-content:center; padding:20px; overflow-y:auto;}
#acctPick.on{display:flex;}
.pkbox{max-width:660px; width:100%; text-align:center;}
.pkbox h1{font-size:29px; margin-bottom:6px;}
.pkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin-bottom:20px;}
.pkcard{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:20px 12px; cursor:pointer; transition:transform .12s, border-color .12s; position:relative;}
.pkcard:hover{transform:translateY(-3px) scale(1.02); border-color:var(--bamboo);}
.pkdel{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; background:var(--bg2); border:1px solid var(--line); color:var(--dim); font-size:12px; line-height:1; opacity:.5;}
.pkdel:hover{background:var(--red); color:#fff; border-color:var(--red); opacity:1;}
.pkcard .pkface{font-size:52px; display:block; animation:bob 1.4s ease-in-out infinite alternate;}
.pkcard b{display:block; margin-top:8px; font-size:17px;}
.pkcard .pkbelt{color:var(--dim); font-size:12.5px; margin-top:4px; display:block;}
.pkcard.newpk{border-style:dashed; color:var(--dim); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:38px;}
#pkCreate{display:none; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; text-align:left;}
#pkCreate.on{display:block;}
.avpick{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 14px;}
.avpick button{font-size:26px; background:var(--bg2); border:2px solid var(--line); border-radius:12px; padding:6px 10px;}
.avpick button.sel{border-color:var(--gold); background:var(--card2);}
#userChip{cursor:pointer;}
#userChip:hover{border-color:var(--bamboo); color:var(--ink);}
/* ===== THE UNBOTHERED QUEST — gothic storybook skin, scoped ===== */
.qgothic{--bg2:#191531; --card:#231d43; --card2:#2c2555; --ink:#eae6ff; --dim:#9c93cb; --bamboo:#7ee8b0; --gold:#e8d98c; --red:#e88ba0; --blue:#9db8ff; --purple:#c8a8ff; --line:#3b3470;
  background:radial-gradient(900px 460px at 50% -12%, #2e2560 0%, #16121f 72%);
  border:1px solid #38316a; border-radius:24px; padding:24px; font-family:Georgia,"Noto Serif",serif;}
.qgothic .opt{font-family:inherit; background:#241e46; border-color:#3b3470;}
.qgothic .opt:hover:not(:disabled){border-color:var(--bamboo);}
.qgothic .opt.lit{border-color:var(--gold); box-shadow:0 0 14px rgba(232,217,140,.45);}
.qgothic .opt.correct{background:#1b3a2d;} .qgothic .opt.wrongpick{background:#3a1b2a;}
.qgothic textarea{background:#1c1736; border-color:#3b3470;}
.qgothic textarea:focus{border-color:var(--bamboo);}
.qart{display:block; width:100%; max-height:260px; object-fit:cover; border-radius:16px; margin-bottom:16px; border:1px solid #38316a;}
.qtop{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
.qtop .qchapter{font-size:13px; letter-spacing:1px; color:var(--dim); text-transform:uppercase;}
.qgloom{display:flex; gap:9px; margin-left:auto;}
.qorb{font-size:18px; line-height:1; transition:all .35s;}
.qorb.on{filter:none; text-shadow:0 0 9px rgba(232,217,140,.6);}
.qorb.off{opacity:.25; filter:grayscale(1);}
.qjlabel{font-size:12px; color:var(--dim); letter-spacing:.5px; margin-left:auto; align-self:center; font-style:italic;}
.qsound{font-size:17px; line-height:1; transition:all .4s;}
.qsound.on{color:var(--gold); text-shadow:0 0 8px rgba(232,217,140,.55);}
.qsound.out{color:var(--purple); opacity:.55;}
.qorb{width:22px; height:22px; border-radius:50%; border:2px solid #4a4185; background:#1c1736;}
.qorb.on{background:radial-gradient(circle at 35% 30%, #cbbcff, #5c4cae); box-shadow:0 0 10px rgba(160,140,255,.7); border-color:#8f7de0;}
.qnarr{background:#1d1838; border-left:3px solid #6a5cc0; border-radius:0 14px 14px 0; padding:14px 18px; font-size:17px; line-height:1.6; color:#d8d2f5; font-style:italic;}
.qscene{display:flex; gap:14px; align-items:flex-start; margin:4px 0 10px;}
.qav{font-size:40px; width:66px; height:66px; display:flex; align-items:center; justify-content:center; background:#241e46; border:2px solid #3b3470; border-radius:50%; flex-shrink:0; position:relative; overflow:hidden;}
.qav img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%;}
.qwhy{display:block; font-size:12.5px; color:#b7a97f; font-style:italic; margin-top:5px;}
.qbub{background:#241e46; border:1px solid #463d85; border-radius:18px 18px 18px 4px; padding:15px 18px; font-size:19px; line-height:1.45;}
.qsense{background:#14261f; border:1px solid #2f5c48; border-radius:14px; padding:13px 16px; font-size:15.5px; color:#bfe8d2; margin-top:4px;}
.qtap{text-align:center; color:var(--dim); font-size:12.5px; margin-top:16px; animation:pulse 1.6s infinite; cursor:pointer;}
.qgothic .fb{background:#221c42; font-family:system-ui,"Segoe UI",sans-serif;}
.qgothic .fb .coach{font-size:15px;}
.qgothic .hintchip{font-family:system-ui,"Segoe UI",sans-serif;}
.opt.act{border-style:dashed; font-style:italic;}
.opt.act::first-letter{font-style:normal;}
.qnotice{background:#efe6c8; color:#2c2410; border:2px solid #b9a25a; border-radius:6px; padding:18px 22px; font-family:Georgia,serif; font-size:16px; line-height:1.65; box-shadow:inset 0 0 34px rgba(120,90,20,.25); margin:6px 0 12px;}
.qbub.wren{margin-left:auto; background:#14301f; border:1px solid #2f5c48; border-radius:18px 18px 4px 18px; padding:13px 16px; font-size:18px; max-width:82%;}
.qprompt{color:var(--dim); font-size:14px; margin:10px 0 12px; font-style:italic;}
.who{display:block; font-family:inherit; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); opacity:.85; margin-bottom:5px;}
.who.inl{display:inline; color:inherit; opacity:1; letter-spacing:.08em;}
.qbub.wren .who{color:#8fd9b4;}
.who.nlab{color:#8b93a8;}
.qdisp{background:#efe6c8; color:#2c2410; border:1.5px solid #b9a25a; border-radius:5px; padding:12px 18px; font-family:Georgia,serif; font-size:15px; line-height:1.6; box-shadow:inset 0 0 26px rgba(120,90,20,.22); margin:12px 0 4px;}
.qdisp .qcap,.qnotice .qcap{display:block; font-family:inherit; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#7a652f; margin-bottom:7px;}
.hypeart{display:block; max-width:min(84vw,430px); margin:6px auto 10px; border-radius:8px; border:1px solid #4a3d24; box-shadow:0 4px 20px rgba(0,0,0,.5);}

<script>
"use strict";
/* ============================================================
   SNAP BACK DOJO — all content + logic.
   Curriculum: 4 Shields, 6 Fangs. Scenarios: best/ok/wrong.
   ============================================================ */

const FORMS = {
  reporter:{name:"The Reporter", track:"shield", emoji:"🎙️", use:"situational",
    why:"Use ONLY when what she said already sounded weird out loud — loud public cruelties, vague 'everybody hates you' stuff. Ask once, slow, like a judge inspecting something stupid, then let the silence verdict her. <b>Never ask out of curiosity</b> — a curious 'why?' invites her to explain the insult in more detail, and she'll enjoy that. If her line is simple and mean ('ugly jumper'), don't interview her. Flip it, yawn, or dismiss it.",
    how:["Check first: did what she said ALREADY sound dumb? Yes → this move works. No → use a Fang.",
         "One question only, slow and flat: <b>who exactly</b>, <b>why would you say that out loud</b>.",
         "Then stop. Silence is the verdict. Never let it become a conversation — answer or not, deliver a line and leave."],
    lines:["“Why would you say that out loud?” (slow, judge-voice — then just look at her)","“Who exactly said that?” (flat — vagueness dies under specifics)","“What did you just say?” (flat, eyebrow up — making her repeat it kills it)","“Are you okay?” (gentle — only when the cruelty itself is the weird part)"],
    tip:"Delivery: curious like a judge, never hurt like a student. One question, then the verdict or the walk — the moment you two are having a chat, she's won the floor.","hint":"ONE rhetorical judge-question — only if what she said already sounds dumb out loud. Never curious."},
  fog:{name:"The Fog Wall", track:"shield", emoji:"🌫️",
    why:"An insult is a ball thrown at you. Agreeing + being bored means there is nothing for it to bounce off. She came for a reaction and got fog.",
    how:["Agree with the true part of it (or all of it).",
         "Add something bored or silly.",
         "Then move on with your day — visibly unbothered."],
    lines:["Yeah, windy. Wild day. Anyway—","Guilty. I actually try. It's a whole thing.","Mm, probably. I'm a listener.","Tell me something I don't know. Tragic, I know."],
    tip:"Delivery: like she told you it was Tuesday. Bored beats angry every time.","hint":"Agree with the true part, bored. Give the insult nothing to grab, then move on."},
  loop:{name:"The Loop", track:"shield", emoji:"🔁",
    why:"When they PRESS you (demand things, dare you, push you to say stuff), every new sentence gives them something to grab. One word, repeated, has nothing to grab.",
    how:["Say one word: <b>No.</b>",
         "She pushes? Same word. Same flat voice.",
         "No reasons, no excuses, no new sentences. People give up on walls."],
    lines:["No.","I said no.","Nope. No.","Not happening."],
    tip:"Delivery: same words, same tone, like a broken record. Do NOT add a second sentence.","hint":"One flat word: No. No reasons, no second sentence."},
  exit:{name:"The Exit", track:"shield", emoji:"🚪",
    why:"The black-belt move. Some things are not comeback problems — they are pattern problems (daily targeting, group chats, threats). Evidence + grown-ups beats any burn. Exiting is not losing. It is escalating properly, first.",
    how:["In the moment: stay calm, say little, get somewhere safe.",
         "After: write down or screenshot EXACTLY what happened, with dates.",
         "Show a grown-up specifics: <i>the same thing, third time, here are three examples.</i>"],
    lines:["Pass. (keep walking)","No thanks. (flat face, back away)","It's this again, every day — I'm getting a teacher."],
    tip:"Rule of three: same thing happens 3 times = it's a pattern. Patterns get reported.","hint":"This isn't a comeback problem, it's an evidence problem. What's the move that actually wins?"},
  parrot:{name:"The Parrot", track:"fang", emoji:"🦜",
    why:"You repeat her OWN words back, slow and bored. You said nothing new — so you can never be 'mean' — but she now has to hear how weird she sounds. She must explain or retreat. Both are awkward for her.",
    how:["Repeat her exact words, slooow, slightly confused.",
         "Then ask her to say it again, like it's a bit you missed.",
         "Face: curious and unimpressed. Never mean."],
    lines:["“Nobody likes you?” …Whoa. Say it slower.","“'Stop copying me, copycat.'” …Say it again. It sounded weird.","“Ac…tu…al…ly… cringey?” Do that bit again, I missed it."],
    tip:"Delivery: like you're a judge at a talent show and she just bombed.","hint":"Borrow her exact words and hand them back slowly. Which word in what she said is the weird one?"},
  rewrite:{name:"The Rewrite", track:"fang", emoji:"✏️",
    why:"You treat her insult like a bad comedy act you're coaching. You are no longer the target — you're the judge. And her 'burn' becomes a rough draft.",
    how:["Call it weak — as a JOKE, not as a fight.",
         "Ask for another version, better, while you wait.",
         "If she tries again and it's worse: 'That was worse. Sit down.'"],
    lines:["Do it again but funnier. That was your rough draft.","Workshop it. You were close to funny. Close.","Insult me again but actually funny this time. Go on, I'll wait.","Auditions for funny are tomorrow. You can prepare."],
    tip:"Delivery: playful, patient, like a teacher watching a very slow attempt. Do NOT laugh at her — smirk at the bit.","hint":"You're the comedy coach now; she's the amateur. Ask for another version, better."},
  pity:{name:"The Pity", track:"fang", emoji:"🥺",
    why:"When she's loud and ranting and you respond with soft sympathy in front of people, the whole audience sees a girl losing it and a girl who's fine. Instant status flip. She cannot stay furious being cooed at.",
    how:["Soft 'Awww.' Head tilt. Eyes gentle.",
         "Ask if she's okay. MEAN it. Weirdly, mean it.",
         "If she rants more: 'You can keep going if you need to. I'm fine.'"],
    lines:["Awww. Are you okay though? Really?","That sounds exhausting for you — caring about me all day.","Awww, you think about me loads. It's sweet, really.","Okay but… are YOU okay? This is a lot of energy for a Tuesday."],
    tip:"Delivery: genuinely gentle, not sarcastic. The audience reads the tone, so the tone must be real.","hint":"She's trying very hard; you're perfectly fine. Concern beats cruelty in front of a crowd."},
  yawn:{name:"The Yawn", track:"fang", emoji:"🥱",
    why:"Her attack is supposed to be a big deal. You treat it as underwhelming — a mild nothing she's making a whole thing about. Attacks that get a yawn stop coming.",
    how:["React like she read out the shopping list.",
         "Short. Flat. Unbothered. Then turn back to your friend.",
         "Best when she's trying HARD to upset you."],
    lines:["Tell me when it gets interesting. Wait — is this the part?","That's it? I expected more.","Cool. Done?","Good for you. (slow single clap) Was that the bit?","That's a whole plan about MY Friday. Busy you."],
    tip:"Delivery: half-lidded eyes, tiny shrug, then actually go back to what you were doing. That last bit is the punchline.","hint":"She came for drama. Give her underwhelmed. What's the most unbothered reply?"},
  flip:{name:"The Flip", track:"fang", emoji:"🪃",
    why:"Take the frame of her joke and bend it back at her — about the JOKE, never about her body, family or real life. A flip says: your words bounced back. A cruel counter-insult says: your words HURT.",
    how:["Find the angle in her own words and aim it back gently.",
         "Keep it short — one line, then stop.",
         "Hard rule: never body, family, or actual cruel facts. That's not a flip, that's a confession she got to you."],
    lines:["“Nice jumper, lose a fight?” → Yeah. Yours lost the same one.","“What are you looking at?” → You, mostly. It's a hobby now.","“You talk way too much.” → And you listen way too little. We all have flaws."],
    tip:"Delivery: dry, quick, no grin. Then let it sit. Do not stick around to explain the joke.","hint":"Take the frame of her own joke and bend it back — at the joke, not the person."},
  dismissal:{name:"The Dismissal", track:"fang", emoji:"👋",
    why:"The fight is over when YOU say it's over. You end the scene and walk — which means SHE lost, because she didn't even get a second round. The walk IS the comeback.",
    how:["One line that ends the 'show'.",
         "Turn away. Actually walk. Get back to your person or place.",
         "If she shouts 'don't ignore me' — that's the sound of it working."],
    lines:["Come back when you've thought of something good. Door's open.","You'll get another go tomorrow. Practice tonight.","It was good enough for you. Time's up.","Nah — once was plenty. Work on yours.","Watch me. (keep walking)"],
    tip:"Delivery: kind-ish, final, like ending a conversation with a little kid. Walk immediately after.","hint":"One line that ends the scene — delivered by you, on your timing. Then walk."},
};
const FORM_ORDER = ["parrot","fog","flip","rewrite","yawn","pity","dismissal","loop","reporter","exit"];

const VILLAINS = {
  copycat:{name:"The Copycat", emoji:"🦝", blurb:"Copies you, then accuses YOU of copying HER. Obsessed with what you wear, say and do."},
  announcer:{name:"The Announcer", emoji:"📣", blurb:"Performs FOR an audience. Louder when people are watching. Needs eyes on her."},
  gossip:{name:"The Gossip", emoji:"🐍", blurb:"Works sideways: 'everyone agrees', group chats, birthday invitations. Never says it to your face."},
};

/* id, form, villain, setup, taunt, best[], ok[], wrong[], why */
const SCENARIOS = [
{id:"rep1",form:"reporter",villain:"announcer",setup:"Cafeteria. She makes sure the next table can hear:",taunt:"Ugh, why does she ALWAYS sit near us? It's like she doesn't know she isn't invited.",
 best:["\"'Invited'? Since when is the cafeteria a party? Do you have a guest list for lunch?\"", "\"Let me get this straight: you're complaining about proximity in an open room. Is that your big plan?\"", "\"You’re announcing it to the whole table? Bold strategy. Did you rehearse that in the mirror?\""],
 ok:["I didn't ask."],
 wrong:["At least I don't need to announce my presence because nobody cares!", "Why are you so obsessed with where I sit?"],
 why:"Calm curiosity hands the awkwardness straight back to her — then the silence finishes her sentence. Insulting back tells the audience her words landed."},
{id:"rep2",form:"parrot",villain:"copycat",setup:"At break, loudly, holding up her pencil case:",taunt:"Ew, stop copying me! You literally got the same pencil case as me.",
 best:["(Slow, bored tone) \"'Stop copying me?'\" … Then: \"You watched me pick a pencil case that closely. Say that part again for the class?\"", "(Flatly) \"'Ew.'\" … Then: \"That's it? That's your big accusation? Repeat 'ew' one more time so I can hear how hard you're trying.\""],
 ok:["Bold of you to admit you study my stuff that hard."],
 wrong:["Well YOU copied my hair tie first!", "I don't even WANT your stupid pencil case—"],
 why:"Parrot with a trap inside it: her own line, played back slow, plus the one true fact — she watches you harder than you watch her. Let the audience do the maths. Then walk."},
{id:"rep3",form:"reporter",villain:"gossip",setup:"She corners you quietly, smiling:",taunt:"Just so you know, nobody actually wants you at their birthday. Everyone agrees.",
 best:["(Stops, looks at her like she's reporting a weather forecast) \"Quote source? Name and date.\"", "\"Is that a verified fact or just your opinion wearing a disguise?\"", "\"So you're the press release for loneliness? Noted.\""],
 ok:["Cool story.", "I'll check my inbox."],
 wrong:["You’re the one with no friends, not me!", "Please stop saying that, it’s not true!"],
 why:"Gossip runs on vagueness. Specific questions make it very uncomfortable for her and very safe for you. 'Why are you telling me?' exposes that she came FOR a reaction."},
{id:"rep4",form:"yawn",villain:"announcer",setup:"After maths, to her friends but facing you:",taunt:"Everyone saw her answer on the board. It was WRONG. Everyone saw.",
 best:["(Yawns loudly, checking nails) Wrong? Okay. Did you get a medal for spotting it?", "Everyone saw? Cool. I didn't see anyone clapping. Next."],
 ok:["Mmhmm.", "Okay."],
 wrong:["Well at least I was brave enough to try, you coward!", "It wasn't that wrong! I just made a small mistake, please stop shouting!"],
 why:"Her whole bit needs a wound. A bored 'and?' deflates the big reveal — the wrong answer was already on the board; your shrug is the second, better one."},
{id:"rep5",form:"flip",villain:"copycat",setup:"Blocky face, to anyone who'll listen:",taunt:"You're literally trying to be me. It's creepy.",
 best:["“If I copied you, that’s a downgrade. Nobody’s THAT desperate.”", "“You’re so obsessed with me thinking about copying you? That’s the creepy bit.”"],
 ok:["Sure, Jan.", "Okay."],
 wrong:["ME? You've been wearing what I wear for MONTHS!", "Well at least nobody thinks I'M creepy!"],
 why:"Flip rule: take her premise, test it in public daylight, conclusion = absurd. She wrote the joke; you wrote the ending, which is the part everyone remembers."},

{id:"fog1",form:"fog",villain:"announcer",setup:"She spots you at the register and grins:",taunt:"Your hair is a disaster today.",
 best:["Yeah, it's got volume. You should try it sometime.", "True. I woke up like this. Did you wake up boring?", "Yep. It’s called 'windy'. Try looking outside."],
 ok:["Okay.", "Right."],
 wrong:["At least my hair isn't as fake as your personality.", "Please stop, I'm trying to buy my lunch!"],
 why:"Agree + bored = nothing to bounce off. Arguing about your hair means she picked the topic and you joined in."},
{id:"fog2",form:"fog",villain:"gossip",setup:"Said loudly, like it's a fun fact about you:",taunt:"She's SO quiet, it's actually weird.",
 best:["Yeah, I’m conserving my energy for when it actually matters. You’re wasting yours.", "True. Silence is golden. You seem to be going for the tin-can look.", "Mm, probably. Less noise means less chance of saying something boring like that."],
 ok:["I like being quiet.", "That’s a choice I made."],
 wrong:["At least I don’t have to shout to get anyone’s attention!", "Please stop saying things about me, it’s really rude."],
 why:"Owning the 'flaw' before she can use it makes the insult evaporate. Defending it proves it stings."},
{id:"fog3",form:"fog",villain:"copycat",setup:"Rolling her eyes for the group:",taunt:"You're such a try-hard.",
 best:["Guilty. I actually try. It’s a whole thing.", "Yeah, trying beats losing. It’s great."],
 ok:["Maybe I just care about stuff, wild concept."],
 wrong:["You never try anything because you're scared!", "At least I'm GOOD at it!"],
 why:"She needs 'try-hard' to be an insult. You agreeing turns it into a lifestyle she wasn't invited to."},
{id:"fog4",form:"fog",villain:"announcer",setup:"Loud, delighted, pointing, corridor full of people:",taunt:"She FELL OVER in the corridor! Everyone saw it!",
 best:["True. Gravity is undefeated. I’m just the victim of physics.", "Yep, the floor attacked me first. I tried to negotiate but it won."],
 ok:["I fell. It happens. You’re still talking about it though?"],
 wrong:["Well at least I don’t trip over my own face!", "Please stop pointing, you’re being really weird right now."],
 why:"A fall is funny for ten seconds. A big reaction makes it a story that follows her. Bored kills the story."},
{id:"fog5",form:"fog",villain:"gossip",setup:"Mocking-sweet voice:",taunt:"You talk like a baby.",
 best:["Yeah, I’m still in the gurgling phase. Don’t worry, I’ll grow out of it eventually.", "Babies are great listeners. You should try being one so you can actually hear yourself."],
 ok:["Right. Moving on."],
 wrong:["At least I don’t sound like a dying seal when I speak!", "I do not! I talk just like everyone else!"],
 why:"Agreeing + absurd keeps you in on the joke. Defending the insult puts you in the dock."},

{id:"loop1",form:"loop",villain:"copycat",setup:"Holding out her hand, bossy, two friends watching:",taunt:"Give me your glitter pen. Now. I said GIVE it.",
 best:["No.","I said no.","Nope. No."],
 ok:["Not giving it to you."],
 wrong:["Why should I give you MY pen? You always take things and never—","Fine, take it, happy now?"],
 why:"One word. Every reason you add is a door she walks through ('but...but...'). Walls don't explain themselves."},
{id:"loop2",form:"loop",villain:"gossip",setup:"Pressure smile, friends behind her:",taunt:"Say it back to her — tell her she's annoying. Everyone agrees, just say it.",
 best:["No.","No, I'm not saying that.","Not happening."],
 ok:["No, I don't do that."],
 wrong:["She IS a bit annoying actually—","Why would you even ASK me that? That's so mean, asking—"],
 why:"Say the thing and you belong to them. Repeat 'no' flatly and the moment passes with your friends AND your dignity."},
{id:"loop3",form:"loop",villain:"announcer",setup:"Audience gathered, dare delivered:",taunt:"Do the funny voice. Everyone wants it. Go ON.",
 best:["No.","No, I won't.","No."],
 ok:["Not doing it."],
 wrong:["Why would I do a funny voice for you? That's such a weird thing to ask—","I'm NOT doing it, you do it then!"],
 why:"Dares run on your reaction. A flat 'no' repeated is the most boring possible outcome — which is the point."},
{id:"loop4",form:"loop",villain:"copycat",setup:"At lunch, sliding into your table's space:",taunt:"Leave her. Sit with us today instead. It's obvious you'd rather.",
 best:["(Keep eating. Don't look up.) No."],
 ok:["Not today."],
 wrong:["You're just jealous because nobody wants you!", "Why are you doing this? We don't want to hurt your feelings..."],
 why:"Her 'invitation' is a trap: say yes and you lose a friend and learn you can be ordered around. 'No, I'm sitting here' answers everything."},
{id:"loop5",form:"loop",villain:"gossip",setup:"Phone out, everyone waiting:",taunt:"Just send one text saying sorry. They all want it. Don't be rude. Say you're sorry.",
 best:["No.","I said no.","I'm not sending it. No."],
 ok:["That's not happening."],
 wrong:["Why would I apologise? I didn't even DO anything! I would never—","Fine. Whatever. (typing)"],
 why:"If you write the reasons, you're negotiating — negotiating means it's already half true. One word keeps it false."},

{id:"ext1",form:"exit",villain:"gossip",setup:"You get added to a group chat called “her fan club 😂”. You read the first ten messages:",taunt:"nobody in here actually likes her lmao we all just have to pretend 😂😂😂",
 best:["Do not type. Screenshot the chat header and these messages immediately to keep the evidence.", "Leave the group quietly, then show your parent or teacher the screenshots with today's date."],
 ok:["Exit the chat without replying and tell a trusted adult later that day."],
 wrong:["Reply: 'You're all losers for faking it.'", "Type: 'Please don't do this, I'm really upset.'"],
 why:"This is not a comeback problem — it's an evidence problem. Screenshots win fights comebacks can't. Anything you type can be shown around; her chat can't fight back when grown-ups see it."},
{id:"ext2",form:"exit",villain:"announcer",setup:"It's the same taunt, same time, every day for two weeks. Today she says:",taunt:"There she is. The whole school knows you're the weird one now.",
 best:["Tell a grown-up with specifics: “The same thing keeps happening — here are three times, with dates.”","Say it out loud in the moment, calmly: “It's this again. Every day. Let's go to a teacher now.”"],
 ok:["Start writing each day down in your notes app, ready to show someone."],
 wrong:["Keep taking it — reporting would make it worse.","Threaten her back so she stops."],
 why:"Third time isn't an incident, it's a pattern — and patterns get reported with dates and examples. 'She's just mean' does nothing at school. Three dated examples do."},
{id:"ext3",form:"exit",villain:"gossip",setup:"By the bike sheds, voice low for the first time:",taunt:"If you tell ANYONE about any of this, it gets so much worse for you. Understood?",
 best:["Don't answer. Walk straight to a teacher and say: 'She threatened me at the bike sheds today.'", "Say nothing. Go tell an adult exactly what she said, including the words 'gets so much worse'."],
 ok:["Walk away silently. Tell your parents or a teacher tonight with the date and time."],
 wrong:["“You can’t make it worse than you already are.”", "“Please don’t hurt me, I won’t say anything.”"],
 why:"A threat is the moment comebacks stop being enough. Telling isn't tattling — it's escalating first, properly. Promising silence is exactly what she wants."},
{id:"ext4",form:"exit",villain:"announcer",setup:"Two older girls step into your path, the others gather and laugh:",taunt:"Go on then. Say something brave. We dare you. Impress us.",
 best:["Walk straight through the gap they left, eyes fixed on a teacher. Do not look at their faces.", "Go to the nearest adult and say: 'Two girls blocked my path demanding I perform for them.' Give names if you know them."],
 ok:["Keep walking without stopping or making eye contact.", "Walk toward the office door immediately."],
 wrong:["Say something witty to prove you are brave enough to talk back.", "Stand still and explain that you don't want to play their game."],
 why:"The audience IS the trap. A comeback performed on their stage still means you danced for them. Refusing the stage is the only move they hate."},
{id:"ext5",form:"exit",villain:"gossip",setup:"It's been a full week: note in your bag, drawing on your chair, seats 'taken' at lunch. Tired now. She notices:",taunt:"What's wrong? Cat got your tongue? Everyone's STILL talking about you.",
 best:["To a grown-up: “This has happened every day this week — here it is.” (show your notes)","Write down each day's incident first, then show someone. Exit with a plan, not a comeback."],
 ok:["Tell a friend's parent if school seems slow to act."],
 wrong:["Nothing — grown-ups won't understand, keep it to yourself.","Reply to every incident yourself, one by one."],
 why:"A campaign isn't one moment with one right answer — it's many moments, and the move that wins is a dated list in front of an adult who has to act on evidence."},

{id:"par1",form:"parrot",villain:"copycat",setup:"Shrieking across the playground for maximum attention:",taunt:"Stop copying me, COPYCAT!",
 best:["(Deadpan, slow) “'Stop copying me, COPYCAT.'” …Pause. “Say it again. I want to hear the bit where you admit you have no original thoughts.”", "(Flat stare) “'Stop copying me, copycat.'” Tilt head. “Was that supposed to be clever? It sounded like a broken record.”"],
 ok:["“Copycat? That’s the best you’ve got?”", "“Okay. Now go find your own words.”"],
 wrong:["Well stop copying ME then, copycat!", "I don't even look like you, you wish!"],

{id:"par2",form:"parrot",villain:"announcer",setup:"Announcing to the whole dinner hall, arms wide:",taunt:"NOBODY LIKES YOU!",

{id:"par3",form:"parrot",villain:"gossip",setup:"To her friends, just loud enough for you:",taunt:"She's, like, actually cringey.",

{id:"par4",form:"parrot",villain:"copycat",setup:"Pinching her nose dramatically:",taunt:"Why are you breathing so LOUD? It's so annoying.",

{id:"par5",form:"parrot",villain:"announcer",setup:"Trying hard for laughs in class:",taunt:"You're so basic it HURTS.",

{id:"rew1",form:"rewrite",villain:"announcer",setup:"Holding up your drawing so everyone sees:",taunt:"Your drawing looks like GARBAGE.",

{id:"rew2",form:"rewrite",villain:"copycat",setup:"Singing it mockingly around friends:",taunt:"Her DANCE is EVIL! It's actually horrible!",

{id:"rew3",form:"rewrite",villain:"announcer",setup:"To the group, gesturing at your hair:",taunt:"She's got a bit sticking up — she looks like a BIRD.",

{id:"pit1",form:"pity",villain:"announcer",setup:"Mid-rant, working herself up over nothing, building an audience:",taunt:"And ANOTHER thing — she thinks she's SO special, walking around like— all of you, LOOK at this—",

{id:"pit2",form:"pity",villain:"gossip",setup:"Almost bouncing, needing you to be upset:",taunt:"Everyone IS talking about you right now, in the GROUP, right NOW!",

{id:"pit3",form:"pity",villain:"copycat",setup:"Fuming, genuinely confused why you're fine:",taunt:"Why does EVERYTHING I have, you WANT?!",

{id:"pit4",form:"pity",villain:"announcer",setup:"Trying a serious wound, testing if it works:",taunt:"You're actually embarrassing. It's not even funny anymore.",

{id:"pit5",form:"pity",villain:"gossip",setup:"Keeping score, desperate for tears:",taunt:"You know they're all laughing at you in the dinner hall right now, right? RIGHT?",

{id:"dis3",form:"dismissal",villain:"gossip",setup:"Refusing to accept how it went:",taunt:"That's not even a comeback! You didn't even ANSWER me!",

{id:"dis4",form:"dismissal",villain:"copycat",setup:"Pouting, wanting her moment back:",taunt:"Say it again then! Say your little thing again!",

{id:"dis5",form:"dismissal",villain:"announcer",setup:"The audience still watching. Last shot, rising panic:",taunt:"You can't just WALK AWAY from me!",
 best:["“Watch the feet.” (keep walking)", "“You’re talking to my back now. Bye.”"],
 ok:["(Silent walk toward a teacher)"],

];

  {n:"White Rope", xp:0, c:"🤍"}, {n:"Yellow Rope", xp:120, c:"💛"},
  {n:"Orange Rope", xp:300, c:"🧡"}, {n:"Green Rope", xp:560, c:"💚"},
  {n:"Blue Rope", xp:900, c:"💙"}, {n:"Purple Rope", xp:1350, c:"🟣"},
  {n:"Brown Rope", xp:1900, c:"🟤"}, {n:"BLACK BELT", xp:2500, c:"🖤"},
];
const FUN_WORDS = ["wiggle","soggy","bananas","flibbertigibbet","nonsense","toots","kerfuffle","silly goose","bonkers","wobble","squish","rumpy","doink","nincompoop","splunge","whoopsie","bumble","gloop","fuzzle","skedaddle","flapdoodle","goober","wampum","snoodle"];

/* ============================================================ state */
const DEFAULTS = {
  xp:0, formsLearned:[], bossWins:[], seen:{}, streak:{n:0, last:""},
  settings:{ai:true, qwenTts:"off", voiceBully:"", voiceSensei:"", rateBully:0.95, pitchBully:0.95, rateSensei:1.0, pitchSensei:0.85},
  custom:[], overrides:{},
  coins:0, owned:[], title:"", theme:"", achv:[], petName:"Noodle",
  counters:{best:0, earned:0, bestCombo:0, books:0},
  quest:{chapter:0, scene:0, cleared:[], stars:{}}, questOv:{},
};
let S = JSON.parse(JSON.stringify(DEFAULTS));
/* DB = the whole dojo: every ninja's account + who's signed in.
   S always points at the signed-in ninja's state. Old single-account
   data files are migrated into a "Ninja" account on first load. */
let DB = {accounts:{}, active:""};
const AVATARS = ["🦊","🐸","🐼","🦄","🐧","🐹","🦖","🐝","🐨","🦋","🐙","🌟"];
let CAPS = {chat:false, tts:false, stt:false};
let saveTimer = null;

function deepMerge(base, over){
  const out = JSON.parse(JSON.stringify(base));
  for (const k in over){
    if (over[k] && typeof over[k]==="object" && !Array.isArray(over[k]) && typeof out[k]==="object" && out[k]!==null && !Array.isArray(out[k]))
      out[k] = deepMerge(out[k], over[k]);
    else if (over[k] !== undefined) out[k] = over[k];
  }
  return out;
}
function adoptStore(d){
  if (d && d.accounts) {
    DB.accounts = d.accounts;
    DB.active = (d.active && d.accounts[d.active]) ? d.active : "";
  } else if (d && Object.keys(d).length) {
    DB.accounts = { "Ninja": { emoji:"🦊", state: d } };  // legacy blob → first ninja
    DB.active = "Ninja";
  }
  if (DB.active) S = deepMerge(JSON.parse(JSON.stringify(DEFAULTS)), DB.accounts[DB.active].state || {});
}
function loadState(){
  try { const ls = localStorage.getItem("snapback"); if (ls) adoptStore(JSON.parse(ls)); } catch(e){}
  return fetch("/api/data").then(r=>r.json()).then(d=>{ adoptStore(d); render(); return d; }).catch(()=>{});
}
function save(){
  if (DB.active && DB.accounts[DB.active]) DB.accounts[DB.active].state = S;
  try { localStorage.setItem("snapback", JSON.stringify(DB)); } catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>fetch("/api/data",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(DB)}).catch(()=>{}), 600);
}
/* Effective pack = built-ins (with any parent overrides layered on) + custom cards.
   Overrides never touch SCENARIOS, so "revert" and pack-export stay honest. */
const allScenarios = () => SCENARIOS.map(s => S.overrides && S.overrides[s.id] ? Object.assign({}, s, S.overrides[s.id]) : s)
  .concat(S.custom.map(c=>Object.assign({}, c, {custom:true})));
const okLine = s => (s.ok && s.ok[0]) || "Okay, sure.";
const wrongLines = s => {
  const w = (s.wrong||[]).filter(Boolean);
  while (w.length < 2) w.push(w.length===0 ? "Shut up!" : "Please just stop!");
  return w;
};

function beltIdx(){ let i=0; BELTS.forEach((b,j)=>{ if (S.xp>=b.xp) i=j; }); return i; }
function addXp(n, ev){
  const before = beltIdx();
  S.xp = Math.max(0, S.xp + n);
  const after = beltIdx();
  if (ev && n>0){
    const f = document.createElement("div");
    f.className = "floatxp"; f.textContent = "+"+n+" XP";
    f.style.left = ev.clientX+"px"; f.style.top = ev.clientY+"px";
    document.body.appendChild(f); setTimeout(()=>f.remove(), 1200);
  }
  if (after > before){
    const b = BELTS[after], p = PET_STAGES[after];
    const bonus = 30*(after-before);
    setTimeout(()=>{
      addCoins(bonus);
      hypeShow({emoji:p.emoji, head:b.c+" "+b.n+" — and " + petNm() + " evolved!",
        line:(RANK_LINES[after]||"Something big just happened.")+"<br><b>"+petNm()+" is now "+p.emoji+" "+p.name+"</b><br>"+p.line,
        prize:"belt bonus: +🪙 "+bonus});
    }, 350);
  }
  save(); renderHeader();
}
function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  if (S.streak.last === today) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak.n = (S.streak.last === y) ? S.streak.n+1 : 1;
  S.streak.last = today; save();
}

/* ============================================================ coins, hype & treasure

let VOICES = [];
function loadVoices(){ if ("speechSynthesis" in window) VOICES = speechSynthesis.getVoices(); }
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickDefaultVoice(){
  const gb = VOICES.filter(v=>/^en-GB/i.test(v.lang));
  const fem = gb.find(v=>/serena|sonia|libby|ava|zira|kate|susan/i.test(v.name));
  return (fem||gb[0]||VOICES[0]||{}).name || "";
}
let pendingAudio = null;
let speakCB = null;
async function speak(text, persona, onDone, queue){
  text = String(text||"").replace(/[“”]/g,'"');
  speakCB = onDone || null;
  const myCb = speakCB;
  const fire = ()=>{ if (myCb && speakCB===myCb){ speakCB=null; myCb(); } };
  // safety: if the voice never reports "end", start anyway after a reading-time estimate
  if (myCb) setTimeout(()=>{ if (speakCB===myCb){ speakCB=null; myCb(); } }, 1500 + text.length*150);
  if (!queue && pendingAudio){ try{ pendingAudio.pause(); }catch(e){} pendingAudio=null; }
  const canBrowser = "speechSynthesis" in window;
  if (!canBrowser && !(S.settings.qwenTts === "on" && CAPS.tts)){ fire(); return; }
  if (canBrowser && !queue) speechSynthesis.cancel();
  if (S.settings.qwenTts === "on" && CAPS.tts){
    try {
      const tv = STORY_VOICES[persona] ? ((persona==="narr"||persona==="pet") ? "sensei" : "bully") : persona;
      const r = await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text, voice:tv})});
      if (r.ok){
        const j = await r.json();
        const ar = await fetch("/api/tts/audio/"+j.key);
        if (ar.ok){
          const blob = await ar.blob();
          pendingAudio = new Audio(URL.createObjectURL(blob));
          pendingAudio.onended = fire;
          pendingAudio.onerror = fire;
          pendingAudio.play().catch(fire);
          return;
        }
      }
    } catch(e){ /* fall through to browser */ }
  }
  browserSpeak(text, persona, fire);
}
function browserSpeak(text, persona, onEnd){
  const stt = new SpeechSynthesisUtterance(text);
  const pr = STORY_VOICES[persona];
  if (pr){
    const pool = VOICES.filter(v=>/^en/i.test(v.lang||""));
    const gb = pool.filter(v=>/^en-GB/i.test(v.lang));
    const use = gb.length ? gb : pool;
    const v = (pr.re && use.find(x=>pr.re.test(x.name||""))) || use[(pr.idx||0)%use.length] || VOICES[0];
    if (v) stt.voice = v;
    stt.pitch = pr.pitch; stt.rate = pr.rate;
  } else {
  const name = persona==="sensei" ? (S.settings.voiceSensei || S.settings.voiceBully) : S.settings.voiceBully;
  const v = VOICES.find(x=>x.name===name) || VOICES.find(x=>/^en-GB/i.test(x.lang)) || VOICES[0];
  if (v) stt.voice = v;
  if (persona==="sensei"){ stt.rate=S.settings.rateSensei; stt.pitch=S.settings.pitchSensei; }
  else { stt.rate=S.settings.rateBully; stt.pitch=S.settings.pitchBully; }
  }
  if (onEnd){ stt.onend = onEnd; stt.onerror = onEnd; }
  speechSynthesis.speak(stt);
}

/* ============================================================ STT (mic) */
function micButtonSafe(){ return '<button class="btn secondary" id="micBtn">🎤 speak</button>'; }
async function startMic(btn, textarea){
  btn.disabled = true; btn.textContent = "🔴 listening…";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const rec = new MediaRecorder(stream, {mimeType: "audio/webm"});
    const chunks = [];
    rec.ondataavailable = e=>chunks.push(e.data);
    rec.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      btn.textContent = "⏳…";
      try {
        const fd = new FormData();
        fd.append("file", new Blob(chunks, {type:"audio/webm"}), "a.webm");
        fd.append("model", "qwen3-asr");
        const r = await fetch("/api/stt", {method:"POST", body:fd});
        const j = await r.json();
        const txt = (j.text||"").trim();
        if (txt) textarea.value = (textarea.value ? textarea.value+" " : "") + txt;
        else toast("Didn't catch that — try again");
      } catch(e){ toast("Mic service unavailable"); }
      textarea.focus(); btn.disabled=false; btn.textContent="🎤 speak";
    };
    rec.start();
    btn.onclick = ()=>rec.state==="recording" && rec.stop();
  } catch(e){
    btn.disabled=false; btn.textContent="🎤 speak";
    toast("Mic blocked — type or press Win+H in the box");
  }
}

/* ============================================================ scoring */
const INSULTS = ["shut up","shut it","ugly","stupid","idiot","dumb","loser","fat","shut your","your mum","ur mum","your mom","bitch","stfu","hate you","dumbass","smelly","worthless","nobody likes","trash","garbage face"];
const DEFENSIVE = /\b(i didn't|i did not|i wasn't|it's not my fault|i promise|not fair|it isn't fair|i never|i swear|why are you like this)\b/i;
function norm(s){ return s.toLowerCase().replace(/[’']/g,"'").replace(/[^\w\s?!.,—-]/g,"").trim(); }

/* The dojo's grading philosophy: a reply WINS when it ends the scene and makes
   the attack visibly fall flat. A question only wins when it's a judge, not a
   student — a curious "why did you say that?" hands the bully round two. */
function ruleGrade(scn, reply){
  const n = norm(reply), words = n.split(/\s+/).filter(Boolean), len = words.length;
  const bestHit = scn.best.some(b=>{ const bn = norm(b); return bn && (n===bn || (bn.split(/\s+/).length>=3 && bn.split(/\s+/).slice(0,3).join(" ")===words.slice(0,3).join(" "))); });
  const wrongHit = scn.wrong.some(w=>norm(w)===n);
  const insulted = INSULTS.some(w=>n.includes(w));
  const plead = /\b(please|stop it|i'm telling|i am telling|tell the teacher)\b/.test(n) || DEFENSIVE.test(n);
  const whyQ = /\?\s*$/.test(n) && /\b(why (did|do|would|are|do you)|what did you mean|explain( yourself)?|what's your problem)\b/.test(n);
  const replay = /\b(say (that|it|this) (again|slower)|say it slower|again but|one more time|run that by me|heard (that|it) out loud|do (that|it) again)\b/.test(n);
  const dismiss = /\b(come back when|practice (tonight|at home|first)|time's up|watch me|i'?ll (still )?be here|cool\.? done|done\??$|work on yours|encore|door'?s open|that's (all|it)\b.*bye|bye\.?$|anyway)\b/.test(n);
  const verdict = /\b(weak|rough draft|punchline|that'?s the best|really\??|ooh you rhymed|bold|interesting|noted|and\??$|so\??$|mm\b|expected (more|better)|auditions|workshop)\b/.test(n);
  const agree = /\b(yeah|yep|yup|guilty|true|i know right|tell me something i don'?t know|probably|maybe i am|mystery|fair enough)\b/.test(n);

  if (insulted || wrongHit)
    return {quality:"wrong", coach:"There's the counter-insult — it feels strong, but it PROVES her words hit, turns one scene into a war where you both get blame, and gives her the sequel she came for.", better:pickBetter(scn, n)};
  if (plead)
    return {quality:"wrong", coach:"That pleads or protests — pleading is the one thing a bully feeds on. Never ask it to stop; end it instead.", better:pickBetter(scn, n)};
  if (bestHit)
    return {quality:"best", coach:"Yes — that's exactly the move. Clean, short, the moment ended with YOUR line.", better:""};
  if (whyQ && scn.form !== "reporter")
    return {quality:"okish", coach:"Careful — asking her WHY invites her to explain the insult in more detail, on her terms, with an audience. A question only works as a judge, never as a student.", better:pickBetter(scn, n)};
  if (whyQ && len <= 9)
    return {quality:"best", coach:"Short, slow, judge-voice — she has to hear how dumb it sounded. Now deliver the verdict or walk; don't let it become a chat.", better:""};
  if (whyQ)
    return {quality:"okish", coach:"A question, and a long one — the interviewer role belongs to whoever talks more. Ask once like a judge, then leave.", better:pickBetter(scn, n)};
  if (replay)
    return {quality:"best", coach:"You made HER hear herself — funniest move available and you never said a mean word. Unbeatable maths.", better:""};
  if (dismiss)
    return {quality:"best", coach:"That closed the scene on your time, not hers. She lost the audience AND the ending.", better:""};
  if (verdict && len <= 12)
    return {quality:"best", coach:"A bored verdict — you graded her joke instead of defending yourself. Completely different power position.", better:""};
  if (agree && len <= 14)
    return {quality:"best", coach:"You agreed and yawned — an insult with nothing to land on just hits the floor.", better:""};
  if (len > 14)
    return {quality:"okish", coach:"Good instinct, wrong length: a paragraph where a sentence ends it. Long replies leak — they look like the insult is still working on you.", better:pickBetter(scn, n)};
  return {quality:"okish", coach:"Calm and safe, but it doesn't close the door — she'll try again in five minutes. Aim for a verdict, a flip, or an exit with your line in it.", better:pickBetter(scn, n)};
}
/* scenario-specific suggestion: pick their own best line that's short and unlike what she said */
function pickBetter(scn, n){
  const words = new Set(norm(n).split(/\s+/));
  const cands = (scn.best||[]).filter(b=>b);
  if (!cands.length) return "";
  const scored = cands.map(b=>{
    const bw = norm(b).split(/\s+/);
    const overlap = bw.filter(w=>words.has(w)).length / Math.max(1,bw.length);
    return {b, s: overlap - bw.length*0.03};
  }).sort((a,b)=>b.s-a.s);
  return scored[0].b;
}

function extractJson(text){
  const i = text.indexOf("{");
  if (i < 0) return null;
  for (let j = text.length; j > i; j--){
    try { return JSON.parse(text.slice(i, j)); } catch(e){}
  }
  return null;
}
async function aiGrade(scn, reply){
  const sys = "You are Sensei — a sharp, dry, brutally funny ninja-dojo coach teaching a 10-year-old girl to end school-bully moments with one line. Voice: concise, witty, a little savage, entirely on her side. Praise like a coach, not a cheerleader. NEVER therapist voice, never lectures, never 'that must have been hard'. WINNING means the moment ENDS: the bully's attack lies flat on the floor and the girl looks completely unbothered in front of whoever is watching. Grade her reply to one taunt. Reply with ONLY a JSON object (no markdown) exactly like: {\"quality\":\"best|okish|wrong\",\"coach\":\"one sharp kid-voice sentence about what her reply DID to the bully — specific, witty\",\"better\":\"one line that ENDS it, or empty string if hers was great\"}. GRADING: (1) Replies that grab the bully's own words and turn them back on her are best — even spicy ones; if it's genuinely mean, still praise the turn and note the cost in one clause ('that starts a roast war — deliver it and walk, don't wait around'). (2) Bored verdicts, slow-replays, agree-and-blow-up-to-absurd, dismissals that close the scene, a flat 'No' under pressure: best. (3) Fresh attacks on her body or family that aren't flipping the bully's own frame: wrong — the cost, not the morality: it proves the first insult landed and makes the teachers blame both girls. (4) Pleading, protesting, defending, over-explaining: wrong. (5) A curious 'why did you say that?' inviting elaboration: okish; rhetorical judge-voiced questions: best. (6) A reply that ACCEPTS, concedes or thanks for the insult ('thanks, I'll practise more') is WRONG, and you must NEVER suggest anything like it as 'better' — never suggest fog/self-deprecation as a fix when the taunt was genuinely cruel; match the mean level of the moment: after a harsh taunt the fix usually has teeth. 'better' lines must end the moment, turn her own words if possible, never open a topic, never mum-jokes or body parts. If her reply already ended it: empty string.";
  const user = JSON.stringify({
    taunt: scn.taunt, scene: scn.setup,
    move_being_trained: FORMS[scn.form] ? FORMS[scn.form].name : "any",
    good_examples: scn.best.slice(0,2), bad_examples: scn.wrong.slice(0,2),
    her_reply: reply,
  });
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), 8000);
  try {
    const r = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      signal: ctl.signal,
      body: JSON.stringify({messages:[{role:"system",content:sys},{role:"user",content:user}], max_tokens:350, temperature:0.6})});
    clearTimeout(t);
    if (!r.ok) return null;
    const j = await r.json();
    const content = (((j.choices||[])[0]||{}).message||{}).content || "";
    const parsed = extractJson(content);
    if (!parsed || !parsed.quality) return null;
    if (!["best","okish","wrong"].includes(parsed.quality)) parsed.quality = "okish";
    return parsed;
  } catch(e){ clearTimeout(t); return null; }
}

/* ============================================================ router */
let timers = [];
function clearTimers(){
  timers.forEach(t=>{ clearTimeout(t); clearInterval(t); });
  timers = [];
  if (rf) rf.done = true;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (pendingAudio){ try{ pendingAudio.pause(); }catch(e){} pendingAudio=null; }
  speakCB = null;
}
const screens = ["home","learn","drill","rapid","boss","book","loot","quest"];
function go(name){
  clearTimers();
  screens.forEach(s=>document.getElementById("s-"+s).classList.toggle("on", s===name));
  window.scrollTo(0,0);
  if (name==="home") renderHome();
  if (name==="learn") renderLearn();
  if (name==="loot") renderLoot();
  if (name==="quest") renderQuest();
}

function nextDue(){
  const seen = S.seen;
  return Math.max(1, allScenarios().filter(s=>!seen[s.id] || (seen[s.id].wrong||0)>=(seen[s.id].correct||0)).length);
}

/* ============================================================ scenario picking */
function pickScenarios(n){
  const pool = allScenarios();
  const stuck = pool.filter(s=>(S.seen[s.id] && (S.seen[s.id].wrong||0)>(S.seen[s.id].correct||0)));
  const fresh = pool.filter(s=>!(s.id in S.seen));
  const rest = pool.filter(s=>!stuck.includes(s) && !fresh.includes(s));
  const out = stuck.slice(0, Math.ceil(n/2));
  const add = fresh.concat(rest).sort(()=>Math.random()-0.5);
  for (const s of add){ if (out.length>=n) break; if (!out.includes(s)) out.push(s); }
  return out.slice(0,n).sort(()=>Math.random()-0.5);
}

let drill = null;
function startDrill(){
  drill = {list: pickScenarios(8), i:0, right:0, answered:false, typedMode:false};
  go("drill"); drawDrill();
}
function drawDrill(){
  const el = document.getElementById("s-drill");
  if (drill.i >= drill.list.length){
    const done = drill.right;
    if (!drill.rewarded){ drill.rewarded = true; addCoins(10); confetti(); checkAchv(); maybeLoot(1, 2200); }
    el.innerHTML = `<div class="card stage"><h2>Drill complete 🎯</h2>
      <p>${done}/${drill.list.length} best answers. ${done>=6?"Sensei nods slowly. 'You are ready for the ones who are watching.'":done>=3?"Good reps. The stuck ones are queued for tomorrow.":"Slow start — try the Learn moves first, then come back."}</p><br>
      <button class="btn" id="dBook">📕 Close the Book</button>
      <button class="btn secondary" id="dHome">Back to dojo</button></div>`;
    document.getElementById("dBook").onclick = ()=>startBook();
    document.getElementById("dHome").onclick = ()=>go("home");
    return;
  }
  const s = drill.list[drill.i], V = VILLAINS[s.villain]||VILLAINS.gossip, F = FORMS[s.form];
  drill.answered = false;
  el.innerHTML = `
    <button class="ghost backbtn" onclick="go('home')">✕ quit drill</button>
    <p class="sub" style="margin-bottom:8px;">Scenario ${drill.i+1} of ${drill.list.length}${F?` · trained move: <b>${F.emoji} ${F.name}</b>`:""}</p>
    <div class="stage">
      <div class="scene"><div class="avatar">${V.emoji}</div><div class="setup">${V.name} · ${s.setup}</div></div>

        <button class="btn secondary" id="toType">${drill.typedMode?"🎲 pick an option":"⌨️ type your own"}</button>

      </div>
      <div id="answerArea"></div>
      <div id="fbArea"></div>
    </div>`;
  document.getElementById("repBtn").onclick = ()=>speak(s.taunt,"bully");
  document.getElementById("toType").onclick = ()=>{ drill.typedMode = !drill.typedMode; drillAnswerArea(); };
  document.getElementById("hintBtn").onclick = ()=>toast(F?("Move: "+F.emoji+" "+F.name+". "+(F.hint||"Short, calm, and it must END it.")):"Keep it short and calm");
  speak(s.taunt,"bully");
  drillAnswerArea();
}
function drillAnswerArea(){
  if (drill.typedMode) drawTyped(); else drawChoice();
}
function drawChoice(){
  const s = drill.list[drill.i];
  const opts = [
    {t:s.best[0]||"Say it again — slower.", g:"best"},
    {t:okLine(s), g:"ok"},
    {t:wrongLines(s)[0], g:"wrong"},
    {t:wrongLines(s)[1], g:"wrong"},
  ].sort(()=>Math.random()-0.5);
  const area = document.getElementById("answerArea");
  area.innerHTML = `<p class="hintchip" style="margin-bottom:10px;">🎯 Pick the line that <b>ends it</b> — one closes the scene, one just holds the wall, two hand her the show.</p>` +
    opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join("");
  area.querySelectorAll(".opt").forEach(b=>b.onclick=(e)=>{
    if (drill.answered) return;
    drill.answered = true;
    const o = opts[+b.dataset.i];
    area.querySelectorAll(".opt").forEach(x=>{
      x.disabled = true;
      const og = opts[+x.dataset.i].g;
      if (og==="best") x.classList.add("correct");
      else if (x===b && o.g==="ok") x.classList.add("okish");
      else if (x===b) x.classList.add("wrongpick");
    });
    finishAnswer(s, o.g, o.t, e);
  });
}
function drawTyped(){
  const s = drill.list[drill.i];
  const area = document.getElementById("answerArea");
  area.innerHTML = `
    <div class="answerbox"><textarea id="typed" placeholder="Your comeback, out loud in your head…"></textarea></div>
    <div class="hintchip">🎤 press <b>Win + H</b> in this box to dictate — or speak it out loud then type.</div>
    ${CAPS.stt ? micButtonSafe() : ""}
    <button class="btn" id="sendBtn">Send it 🥋</button>`;

  if (CAPS.stt){
    const mic = document.getElementById("micBtn");
    if (mic) mic.onclick = ()=>startMic(mic, ta);
  }
  document.getElementById("sendBtn").onclick = async (e)=>{
    const v = ta.value.trim();
    if (!v){ toast("Say something — anything beats silence in the dojo"); return; }
    drill.answered = true;
    document.getElementById("sendBtn").disabled = true;
    ta.disabled = true;
    const fb = document.getElementById("fbArea");
    let g = null;
    if (S.settings.ai && CAPS.chat){
      fb.innerHTML = `<p class="thinking">🦉 Sensei is sizing it up…</p>`;

      catch(err){ g = {quality:"okish", coach:"Sensei tripped over that one — it counts!", better:""}; }
    }
    finishAnswer(s, g.quality, v, e, g);
  };
}
function scoreAdjust(s, delta){ /* small xp tweak from AI disagreement, no float animation */ S.xp = Math.max(0, S.xp+delta); save(); }

function finishAnswer(s, quality, text, ev, ruleResult){
  touchStreak();
  const seen = S.seen[s.id] = S.seen[s.id] || {correct:0, wrong:0};
  if (quality==="best"){ seen.correct++; drill.right++; addXp(10, ev); addCoins(12); S.counters.best++; }
  else if (quality==="okish"){ seen.correct++; drill.right += 0.5; addXp(5, ev); addCoins(6); }
  else { seen.wrong++; addCoins(2, OOPS[Math.floor(Math.random()*OOPS.length)]); }
  save(); checkAchv();
  const V = VILLAINS[s.villain]||VILLAINS.gossip;
  const coach = ruleResult ? "🦉 "+ruleResult.coach :
    quality==="best" ? "🦉 Her attack, on the floor. Moment over. That's the move." :
    quality==="okish" ? "🦉 Safe landing — but that answer doesn't close the door. She'll be back in five minutes." :
    "🦉 That hands her exactly what she came for. Judge replies by what they DO to her, not by how good they feel.";
  const better = ruleResult && ruleResult.better ? "Or try: “"+ruleResult.better+"”" :
    (quality!=="best" && s.best[0] ? "Sensei's version: “"+s.best[0]+"”" : "");
  document.getElementById("fbArea").innerHTML = `

const QUOTES = ["Cold.","That's how you close a door.","She'll replay that one at bedtime. You won't.","Delivered and gone. Textbook.","The room noticed.","Effortless. Do it again tomorrow."];
function pickQuote(){ return QUOTES[Math.floor(Math.random()*QUOTES.length)]; }

/* ============================================================ rapid fire */
let rf = null;
function startRapid(){
  const list = pickScenarios(12);
  go("rapid"); // go() aborts any previous rf — assign fresh AFTER navigating
  rf = {list, i:0, streakCombo:0, hits:0, xpEarned:0, t0:0, done:false, rid:0, listening:true};
  rfRound();
}
function rfRound(){
  const el = document.getElementById("s-rapid");
  if (!rf || rf.done) return;
  if (rf.i >= rf.list.length){ rfFinish(); return; }
  const myId = ++rf.rid;
  const s = rf.list[rf.i];
  rf.listening = true;
  const opts = [
    {t:s.best[0]||"Say it again — slower.", g:"best"},{t:okLine(s), g:"ok"},
    {t:wrongLines(s)[0], g:"wrong"},{t:wrongLines(s)[1], g:"wrong"},
  ].sort(()=>Math.random()-0.5);
  el.innerHTML = `
    <button class="ghost backbtn" onclick="go('home')">✕</button>
    <div class="combo">${rf.streakCombo>1?"🔥 COMBO x"+rf.streakCombo:""}</div>
    <div class="rfbar"><div class="rffill" id="rfFill" style="animation:pulse 1s infinite"></div></div>
    <p class="setup">${(VILLAINS[s.villain]||VILLAINS.gossip).emoji} ${s.taunt}</p>
    <div id="rfOpts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join("")}</div>
    <p class="hintchip" id="rfChip">👂 listening… you can answer already if you know it · Round ${rf.i+1}/12 · ${rf.hits} snapped</p>`;
  const fill = document.getElementById("rfFill");
  const startTimer = ()=>{
    if (!rf || rf.rid !== myId || rf.done) return;
    rf.listening = false;
    if (fill) fill.style.animation = "";
    const chip = document.getElementById("rfChip");
    if (chip) chip.textContent = "⚡ NOW — snap! · Round "+(rf.i+1)+"/12 · "+rf.hits+" snapped";
    const DUR = 3200;
    rf.t0 = performance.now();
    const tick = ()=>{
      if (!rf || rf.rid !== myId || rf.done) return;
      const left = 1 - (performance.now()-rf.t0)/DUR;
      if (left<=0){ rfAnswer(null, opts, myId); return; }
      if (fill) fill.style.width = (left*100)+"%";
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  // the bar only starts when the taunt has finished being read aloud (safety timeout inside speak covers silent voices)
  speak(s.taunt, "bully", startTimer);
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>rfAnswer(+b.dataset.i, opts, myId));
}
function rfAnswer(picked, opts, myId){
  if (!rf || rf.rid !== myId) return;
  rf.rid = -1; // consume the round, stops the rAF timer and any pending startTimer
  document.querySelectorAll("#rfOpts .opt").forEach(x=>x.disabled=true);
  let good=false;
  if (picked!==null){
    const g = opts[picked].g;
    good = g==="best";
    const b = document.querySelectorAll("#rfOpts .opt")[picked];
    b.classList.add(g==="best"?"correct":g==="ok"?"okish":"wrongpick");
  }
  const correctBtn = [...document.querySelectorAll("#rfOpts .opt")].find(x=>opts[+x.dataset.i].g==="best");
  if (correctBtn && !good) correctBtn.classList.add("correct");
  if (good){
    rf.streakCombo++;
    rf.hits++;
    S.counters.bestCombo = Math.max(S.counters.bestCombo||0, rf.streakCombo);
    const gain = 8 + Math.min(rf.streakCombo,5)*2;
    rf.xpEarned += gain;
    const seen = S.seen[rf.list[rf.i].id] = S.seen[rf.list[rf.i].id]||{correct:0,wrong:0};
    seen.correct++;
  } else {
    if (picked===null) toast("⌛ too slow — she said it and you were still buffering!");
    rf.streakCombo = 0;
    const seen = S.seen[rf.list[rf.i].id] = S.seen[rf.list[rf.i].id]||{correct:0,wrong:0};
    seen.wrong++;
  }
  rf.done = false;
  rf.i++;
  timers.push(setTimeout(rfRound, good?600:1100));
}
function rfFinish(){
  rf.done = true;
  touchStreak();
  const xp = rf.xpEarned;
  addXp(xp);
  addCoins(rf.hits*3);
  save(); checkAchv();
  if (rf.hits>=12){ addCoins(20); hypeShow({emoji:"🌟", head:"12 for 12", line:"Flawless. Somewhere a bully is re-reading her own diary, confused.", prize:"perfect-run bonus: +🪙 20"}); }
  else maybeLoot(.55);
  const acc = Math.round(100*rf.hits/12);
  const el = document.getElementById("s-rapid");
  el.innerHTML = `<div class="card stage"><h2>Rapid fire: ${rf.hits}/12 ⚡</h2>
    <p>${acc>=80?"Reflex level: scary. She will say something and instantly regret starting.":acc>=50?"Reflexes building. This is exactly how it becomes automatic — do two rounds a day.":"Reflexes are made here, not born. Tomorrow's round will be faster."}</p>
    <p class="done-quote">+${xp} XP</p>
    <button class="btn" onclick="startRapid()">Again ⚡ (best way to get sharp)</button>
    <button class="btn secondary" onclick="go('home')">Dojo</button></div>`;
}

function bossJudge(s, quality, g, typed, isCorrection){
  const V = VILLAINS[bossRun.boss];
  const dmg = quality==="best"?40:quality==="okish"?18:0;
  bossRun.hp = Math.max(0, bossRun.hp - dmg + (isCorrection ? (bossRun.lastDmg||0) : 0));
  bossRun.lastDmg = dmg;
  if (!isCorrection){
    const seen = S.seen[s.id] = S.seen[s.id]||{correct:0,wrong:0};
    if (quality==="best"){ seen.correct++; addXp(14); addCoins(5); }
    else if (quality==="okish"){ seen.correct++; addXp(7); addCoins(3); }
    else { seen.wrong++; addCoins(1); }
    touchStreak(); save();
    if (quality==="best") speak(pickQuote(),"sensei");
  }
  const self = quality==="wrong"?20:0;
  document.getElementById("fbArea").innerHTML = `
    <div class="fb ${quality==="best"?"best":quality==="okish"?"okish":"wrong"}">
      <div class="verdict">${quality==="best"?"💥 "+V.name+" staggers (-"+dmg+")":quality==="okish"?"🛡 graze (-"+dmg+")":"🩸 she bites back (-"+self+" to YOU)"}</div>

  document.getElementById("bNext").onclick = ()=>{ bossRun.i++; drawBoss(); };
}

function buyItem(id){
  const it = SHOP.find(i=>i.id===id);

  if (it.kind==="sticker") hypeShow({emoji:it.emoji, head:it.name, line:"sticker acquired — fresh on the wall", prize:"🪧 sticker wall: "+S.owned.filter(x=>x.startsWith("st_")).length});

  renderLoot();
}
function useItem(id){
  const it = SHOP.find(i=>i.id===id);
  if (!it || !S.owned.includes(id)) return;
  if (it.kind==="title") S.title = (S.title===id ? "" : id);
  if (it.kind==="theme"){ S.theme = (S.theme===id ? "" : id); applyTheme(); }
  save(); renderLoot();
}
